apis:
- aid: tooljet:tooljet-external-api
  name: ToolJet External API
  description: 'The ToolJet External API provides REST endpoints for managing users,
    workspaces, applications (export/import), and user role assignments across a ToolJet
    instance. It is enabled via environment variables and secured with a static access
    token using Basic authentication.

    '
