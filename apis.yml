specificationVersion: '0.19'
description: 'ToolJet is an open-source low-code platform for building internal tools,
  dashboards, business applications, workflows, and AI agents. It provides a REST
  API (the ToolJet External API) that enables programmatic management of users, workspaces,
  applications, and user roles across self-hosted and cloud deployments. Authentication
  is handled via a static access token configured in environment variables and passed
  as a Basic Authorization header. ToolJet supports connecting to external data sources
  including REST APIs, GraphQL, databases, and cloud storage, and offers OpenAPI-spec-driven
  data source integration within the platform. Pricing spans a free tier up to enterprise
  plans with SSO, Git sync, audit logs, and SCIM provisioning.

  '
